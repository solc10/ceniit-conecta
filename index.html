<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="CENIIT Conecta: proyectos, calendario de eventos y ubicación del Centro de Investigación e Innovación Tecnológica de la UNLaR.">
<meta name="theme-color" content="#013179">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CENIIT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>CENIIT Conecta</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style id="app-style">
/* Layout: app shell — header + one view at a time; bottom tab bar on phones, top nav on desktop. Brand blue from the CENIIT logo. */
:root{
  --blue:#013179; --blue-deep:#01245e; --blue-ink:#0b3d91; --blue-soft:#e8eefa;
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef2f9; --fg:#0e1a33; --muted:#56627c; --line:#dbe2ee;
  --link:#0b46a8; --focus:#2f6be0; --ok:#0f7a4f; --warn:#9a5b00; --danger:#b4232f;
  --on-blue:#ffffff;
  --t-charla:#0b6fa4; --t-charla-bg:#e3f1f9;
  --t-capacitacion:#9a5b00; --t-capacitacion-bg:#fbf0dc;
  --t-presentacion:#5b3fb5; --t-presentacion-bg:#eeeafb;
  --t-taller:#ad2f52; --t-taller-bg:#fbe7ed;
  --t-otro:#2f6b3a; --t-otro-bg:#e3f2e6;
  --shadow:0 1px 2px rgba(1,36,94,.06),0 6px 20px rgba(1,36,94,.07);
  --f-display:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:10px;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#2a5fc4; --blue-deep:#0a1f4d; --blue-ink:#8fb0ff; --blue-soft:#15274a;
  --bg:#0a1122; --surface:#111a30; --surface-2:#18233d; --fg:#e7ecf6; --muted:#9ba7bf; --line:#253252;
  --link:#8fb0ff; --focus:#8fb0ff; --ok:#4cc38a; --warn:#e3a547; --danger:#ff7b86;
  --t-charla:#6cc4f0; --t-charla-bg:#10304a;
  --t-capacitacion:#f0b860; --t-capacitacion-bg:#3a2a10;
  --t-presentacion:#b9a6ff; --t-presentacion-bg:#2a2150;
  --t-taller:#ff8fae; --t-taller-bg:#43182a;
  --t-otro:#7fd493; --t-otro-bg:#163824;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#2a5fc4; --blue-deep:#0a1f4d; --blue-ink:#8fb0ff; --blue-soft:#15274a;
  --bg:#0a1122; --surface:#111a30; --surface-2:#18233d; --fg:#e7ecf6; --muted:#9ba7bf; --line:#253252;
  --link:#8fb0ff; --focus:#8fb0ff; --ok:#4cc38a; --warn:#e3a547; --danger:#ff7b86;
  --t-charla:#6cc4f0; --t-charla-bg:#10304a;
  --t-capacitacion:#f0b860; --t-capacitacion-bg:#3a2a10;
  --t-presentacion:#b9a6ff; --t-presentacion-bg:#2a2150;
  --t-taller:#ff8fae; --t-taller-bg:#43182a;
  --t-otro:#7fd493; --t-otro-bg:#163824;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:16px;height:16px}

/* Header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand img{width:38px;height:38px;border-radius:9px;display:block}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.02em;color:var(--fg);display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block}
.topnav{display:none;margin-left:auto;gap:4px}
.topnav button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:9px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.topnav button:hover{background:var(--surface-2);color:var(--fg)}
.topnav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink)}
.theme-btn{margin-left:auto;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.theme-btn:hover{background:var(--surface-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

/* Bottom tab bar (phones) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h);max-width:560px;margin:0 auto}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabbar button .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s}
.tabbar button[aria-current="page"]{color:var(--blue-ink)}
.tabbar button[aria-current="page"] .pill{background:var(--blue-soft)}
.tabbar .dot{position:absolute;top:10px;right:calc(50% - 20px)}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px));min-height:60vh}
@media (min-width:900px){
  .topnav{display:flex}
  .theme-btn{margin-left:8px}
  .tabbar{display:none}
  main{padding-block:32px 48px}
}

/* Generic */
.section{display:grid;gap:14px;margin-top:34px}
.section:first-child{margin-top:0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:21px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch}
.page-title{display:grid;gap:6px;margin-bottom:18px}
.page-title h1{font-size:clamp(24px,4vw,32px);font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--blue);color:var(--on-blue)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:transparent;border-color:var(--line);color:var(--danger)}
.btn-link{background:none;border:0;color:var(--link);font-weight:600;cursor:pointer;padding:6px 0;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn-icon{width:40px;height:40px;padding:0;border-radius:999px}
.btn[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.empty{padding:32px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.neutral{background:var(--surface-2);color:var(--muted);font-weight:600}
.chip.example{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.t-charla{color:var(--t-charla);background:var(--t-charla-bg)}
.t-capacitacion{color:var(--t-capacitacion);background:var(--t-capacitacion-bg)}
.t-presentacion{color:var(--t-presentacion);background:var(--t-presentacion-bg)}
.t-taller{color:var(--t-taller);background:var(--t-taller-bg)}
.t-otro{color:var(--t-otro);background:var(--t-otro-bg)}
.back{margin-bottom:14px}

/* Hero (flip card) */
.home-top{display:grid;gap:18px}
@media (min-width:900px){.home-top{grid-template-columns:1.25fr 1fr;align-items:stretch}}
.hero{perspective:1400px;cursor:pointer;border:0;padding:0;background:none;text-align:left;width:100%;min-height:290px;display:block}
.hero-in{position:relative;width:100%;height:100%;min-height:290px;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.hero.flipped .hero-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#fff;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  background:radial-gradient(120% 90% at 50% 20%,#0a4aa8 0%,#013179 45%,#01245e 100%)}
.face::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom,#000,transparent 85%);pointer-events:none}
.face>*{position:relative}
.face.back{transform:rotateY(180deg)}
.face .bld{width:min(100%,380px);margin:8px auto 0;display:block;opacity:.95}
.face h1{font-size:clamp(26px,4.4vw,38px);font-weight:800;letter-spacing:.01em}
.face .sub{opacity:.85;font-size:14px}
.face .hint{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;align-self:flex-start}
.face.back h2{font-size:20px}
.face.back p{font-size:14.5px;opacity:.95;max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:12.5px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.hero-in{transition:none}}
@media (max-width:600px){.hero,.hero-in{min-height:400px}.face{padding:20px}.face.back p{font-size:14px}}

.reminder{display:flex;gap:12px;align-items:center;background:var(--blue-soft);color:var(--fg);border-radius:var(--r);padding:14px 16px}
.reminder .icon{color:var(--blue-ink)}
.reminder b{font-weight:700}

/* Up next (home side panel) */
.side{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.side h2{font-size:17px}
.mini{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:10px;border-radius:var(--r-sm);background:none;border:0;text-align:left;cursor:pointer;width:100%}
.mini:hover{background:var(--surface-2)}
.datebox{width:52px;border-radius:10px;text-align:center;padding:6px 0;background:var(--surface-2);font-family:var(--f-display);line-height:1.05}
.datebox b{display:block;font-size:20px;font-weight:800}
.datebox span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.mini h3{font-size:14.5px;font-weight:700;font-family:var(--f-body)}
.mini p{font-size:13px;color:var(--muted)}

/* Project cards */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;width:100%;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard .cover{aspect-ratio:16/7;max-width:100%;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.pcard .cover img{width:100%;height:100%;object-fit:cover}
.cover-art{width:100%;height:100%;display:grid;place-items:center;color:#fff;position:relative;background:linear-gradient(var(--ang,135deg),#0a4aa8 0%,#013179 55%,#01245e 100%)}
.cover-art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.2px);background-size:16px 16px}
.cover-art .icon{position:relative}
.cover-art .icon{width:40px;height:40px;opacity:.85;stroke-width:1.4}
.pcard .body{padding:16px;display:grid;gap:8px}
.pcard h3{font-size:16.5px;font-weight:700}
.pcard p{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta span{display:inline-flex;gap:6px;align-items:center}

/* Filters */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:10}
.filters-row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.input,select.input,textarea.input{width:100%;min-height:42px;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg)}
textarea.input{min-height:110px;resize:vertical}
.input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.search{position:relative}
.search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:40px}
.filters-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.count{font-size:13px;color:var(--muted)}
.collapse-btn{display:flex}
@media (min-width:900px){.collapse-btn{display:none}}
.filters.static{position:static}
.filters.closed .filters-row{display:none}
@media (min-width:900px){.filters.closed .filters-row{display:grid}}

/* Event cards */
.group{display:grid;gap:10px;margin-top:22px}
.group h2{font-size:15px;font-family:var(--f-body);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;gap:8px;align-items:center}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px;cursor:pointer;transition:box-shadow .15s}
.ecard:hover{box-shadow:var(--shadow)}
.ecard.past{opacity:.72}
.ecard .main{display:grid;gap:6px;min-width:0}
.ecard h3{font-size:16px;font-weight:700}
.ecard .time{font-family:var(--f-display);font-weight:700;font-size:13.5px;color:var(--fg);font-variant-numeric:tabular-nums}
.save-btn{width:42px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.save-btn:hover{color:var(--blue-ink);border-color:var(--blue-ink)}
.save-btn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.save-btn[aria-pressed="true"] .icon{fill:currentColor}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}

/* Detail pages */
.detail{max-width:820px;margin:0 auto;display:grid;gap:20px}
.detail-cover{border-radius:18px;overflow:hidden;aspect-ratio:16/7;max-width:100%;background:var(--surface-2)}
.detail-cover img{width:100%;height:100%;object-fit:cover;display:block}
.detail-head{display:grid;gap:10px}
.detail-head h1{font-size:clamp(24px,4.2vw,34px);font-weight:800}
.byline{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px}
.byline span{display:inline-flex;gap:6px;align-items:center}
.standfirst{font-size:18px;line-height:1.5;color:var(--fg);font-weight:500;border-left:3px solid var(--blue);padding-left:14px;max-width:65ch}
.prose{display:grid;gap:14px;max-width:65ch;font-size:16px;line-height:1.7}
.keyinfo{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.keyinfo div{background:var(--surface);padding:14px 16px;display:grid;gap:3px}
.keyinfo dt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.keyinfo dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.two{display:grid;gap:16px}
@media (min-width:700px){.two{grid-template-columns:1fr 1fr}}
.place-photo{border-radius:var(--r);overflow:hidden;background:var(--surface-2);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:13px;padding:0}
.place-photo img{width:100%;height:100%;object-fit:cover;display:block}
.place-photo .ph{display:grid;gap:8px;place-items:center;padding:16px}
.links{display:grid;gap:8px}
.links a{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);text-decoration:none;color:var(--fg);background:var(--surface);font-weight:600}
.links a:hover{border-color:var(--blue-ink)}
.links a .icon{color:var(--blue-ink)}

/* Illustrated map */
.map{position:relative;border-radius:var(--r);overflow:hidden;min-height:220px;display:block;text-decoration:none;color:var(--fg);border:1px solid var(--line);
  background-color:var(--surface-2);
  background-image:
   linear-gradient(28deg,transparent 46%,var(--map-road) 46%,var(--map-road) 50%,transparent 50%),
   linear-gradient(-62deg,transparent 58%,var(--map-road) 58%,var(--map-road) 61%,transparent 61%),
   linear-gradient(var(--map-street) 2px,transparent 2px),
   linear-gradient(90deg,var(--map-street) 2px,transparent 2px),
   radial-gradient(circle at 78% 30%,var(--map-park) 0 13%,transparent 13.5%);
  background-size:100% 100%,100% 100%,46px 46px,46px 46px,100% 100%}
:root{--map-road:#ffffff;--map-street:#dfe6f2;--map-park:#d6ecd9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--map-road:#2c3b5f;--map-street:#1f2b47;--map-park:#1d3b2b}}
:root[data-theme="dark"]{--map-road:#2c3b5f;--map-street:#1f2b47;--map-park:#1d3b2b}
.map .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:0}
.map .pin svg{width:46px;height:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.map .pin span{background:var(--surface);color:var(--fg);font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px;box-shadow:var(--shadow);margin-top:4px;white-space:nowrap}
.map .open{position:absolute;right:12px;bottom:12px;display:inline-flex;gap:8px;align-items:center;background:var(--blue);color:#fff;font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px}

.err{color:var(--danger);font-size:13.5px;font-weight:600}

eo de la investigación de la universidad y que los estudiantes cumplen un papel clave en los proyectos, a través de becas o como colaboradores.", "links": [{"label": "Leer la nota en Multimedio UNLaR", "url": "https://multimediounlar.ar/ceniit-celebra-su-14-aniversario-e-investiga-sobre-mortalidad-adolescente-y-enfermedades-renales/"}], "image": ""}, {"id": "p-renal", "title": "Uso de células para el tratamiento de enfermedades renales", "authors": "Investigadores del CENIIT", "date": "2024-05-22", "topic": "Biotecnología", "featured": false, "lead": "Una línea de investigación que estudia el uso de células para tratar enfermedades del riñón.", "body": "En el 14.º aniversario del CENIIT se presentó un proyecto que investiga el uso de células para el tratamiento de enfermedades renales.\n\nEl trabajo forma parte de las líneas de biología y salud que el Centro desarrolla junto con estudios en el campo social y sobre cannabis.", "links": [{"label": "Leer la nota en Multimedio UNLaR", "url": "https://multimediounlar.ar/ceniit-celebra-su-14-aniversario-e-investiga-sobre-mortalidad-adolescente-y-enfermedades-renales/"}], "image": ""}, {"id": "p-sarscov2", "title": "Investigación sobre SARS-CoV-2 presentada en Tecnópolis", "authors": "Investigadoras del CENIIT", "date": "2021-11-03", "topic": "Salud pública", "featured": false, "lead": "Investigadoras del CENIIT llevaron a Tecnópolis su trabajo sobre el virus SARS-CoV-2.", "body": "Un grupo de investigadoras del CENIIT presentó en Tecnópolis su trabajo sobre el SARS-CoV-2, el virus que causa la COVID-19.\n\nTras la participación, el rector de la UNLaR, Fabián Calderón, se reunió con el equipo en las instalaciones del Centro para conocer los resultados de la experiencia.", "links": [{"label": "Leer la nota en Multimedio UNLaR", "url": "https://multimediounlar.ar/calderon-se-reunio-con-investigadoras-del-ceniit-que-participaron-en-tecnopolis/"}], "image": ""}, {"id": "p-expone", "title": "«Expone tu obra, no tu salud»", "authors": "Dirección: Dra. Patricia Córdoba", "date": "2021-12-02", "topic": "Extensión y seguridad laboral", "featured": false, "lead": "Un proyecto de extensión con talleres sobre seguridad laboral para personas que trabajan en las artes visuales.", "body": "«Expone tu obra, no tu salud» es un proyecto de extensión que ofrece talleres sobre seguridad y salud laboral para artistas visuales, con foco en los riesgos de los materiales y técnicas que se usan en el taller.\n\nDirigido por la Dra. Patricia Córdoba, el proyecto se trasladó a Chilecito para llegar a más artistas de la provincia.", "links": [{"label": "Leer la nota en Multimedio UNLaR", "url": "https://multimediounlar.ar/expone-tu-obra-no-tu-salud-se-traslada-a-chilecito/"}], "image": ""}], "events": [{"id": "e1", "example": true, "title": "IA con identidad local: cómo se construye una herramienta propia", "type": "charla", "topic": "Inteligencia artificial", "date": "2026-10-15", "start": "18:00", "end": "19:30", "modality": "presencial", "venue": "Auditorio del CENIIT", "org": "CENIIT – UNLaR", "mapsUrl": "https://maps.app.goo.gl/DMSkVCYkMJWbnRoN9", "formUrl": "https://forms.gle/", "description": "Una charla abierta sobre el desarrollo de herramientas de inteligencia artificial pensadas desde y para la región: qué datos usan, cómo se entrenan y qué desafíos plantean.\n\nActividad gratuita, con cupo limitado.", "image": "", "placeImage": ""}, {"id": "e2", "example": true, "title": "Introducción al análisis de datos con Python", "type": "capacitacion", "topic": "Ciencia de datos", "date": "2026-10-21", "start": "09:00", "end": "13:00", "modality": "hibrida", "venue": "Laboratorio de Informática del CENIIT", "org": "CENIIT – UNLaR", "mapsUrl": "https://maps.app.goo.gl/DMSkVCYkMJWbnRoN9", "formUrl": "https://forms.gle/", "description": "Capacitación práctica para estudiantes e investigadores que quieran organizar, limpiar y graficar datos de sus proyectos.\n\nSe recomienda llevar computadora. Quienes participen const store={
  get(k,d){try{const v=localStorage.getItem("ceniit:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("ceniit:"+k,JSON.stringify(v))}catch(e){}},
  sget(k,d){try{const v=sessionStorage.getItem("ceniit:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  sset(k,v){try{sessionStorage.setItem("ceniit:"+k,JSON.stringify(v))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const parseD=s=>{const [y,m,d]=(s||"").split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const fmtLong=s=>{if(!s)return"";const d=parseD(s);return DAYS[d.getDay()]+" "+d.getDate()+" de "+MONTHS_L[d.getMonth()]+" de "+d.getFullYear()};
const fmtMid=s=>{if(!s)return"";const d=parseD(s);return d.getDate()+" de "+MONTHS_L[d.getMonth()]+" de "+d.getFullYear()};
const fmtShort=s=>{const d=parseD(s);return d.getDate()+" "+MONTHS[d.getMonth()]};
const mins=t=>{const [h,m]=(t||"0:0").split(":").map(Number);return h*60+(m||0)};
const duration=e=>{const m=mins(e.end)-mins(e.start);if(!(m>0))return"";const h=Math.floor(m/60),r=m%60;return (h?h+" h":"")+(h&&r?" ":"")+(r?r+" min":"")};
const slotOf=t=>{const m=mins(t);return m<720?"manana":m<1140?"tarde":"noche"};
const evStatus=e=>{const t=todayStr();return e.date===t?"today":e.date>t?"next":"past"};
const byDate=(a,b)=>(a.date+a.start).localeCompare(b.date+b.start);
const safeUrl=u=>{u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:""};
const gcal=e=>{const d=e.date.replace(/-/g,"");const t=x=>(x||"00:00").replace(":","")+"00";
  const p=new URLSearchParams({action:"TEMPLATE",text:e.title,dates:d+"T"+t(e.start)+"/"+d+"T"+t(e.end||e.start),details:(e.description||"")+(e.formUrl?"\nInscripción: "+e.formUrl:""),location:e.modality==="virtual"?"Virtual":e.venue||"",ctz:"America/Argentina/Cordoba"});
  return "https://calendar.google.com/calendar/render?"+p.toString()};

let toastTimer;
function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.innerHTML=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},4200)}
const pending=store.sget("toast",null);if(pending){store.sset("toast",null);setTimeout(()=>toast(esc(pending)),400)}

function remember(){store.sset("ui",ui)}
function go(view,param){ui.view=view;ui.param=param||null;ui.confirmDel=null;if(view!=="admin")ui.editing=ui.editing;remember();render();window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"})}

/* ---------- publishing (the page is the record) ---------- */
const artifactP=(window.claude&&window.claude.use)?window.claude.use("artifact").catch(()=>null):Promise.resolve(null);
function buildDoc(){
  const json=JSON.stringify(S).replace(/</g,"\\u003c");
  const style=document.getElementById("app-style").outerHTML;
  const fonts=document.getElementById("app-fonts").outerHTML;
  const main=document.getElementById("app-main").outerHTML;
  return SKELETON_OPEN+'<title>CENIIT Conecta</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+fonts+"\n"+style+'\n\n<div id="app"></div>\n\n<script id="ceniit-data" type="application/json">'+json+"<\/script>\n\n"+main+"\n"+SKELETON_CLOSE;
}
async function persist(okMsg){
  render();
  if(ui.publishBlocked){toast(esc(okMsg)+" · Solo en esta vista (modo demostración)");return}
  if(STANDALONE){try{localStorage.setItem("ceniit:data",JSON.stringify(S));toast(esc(okMsg)+" · Guardado en este dispositivo")}catch(e){toast(esc(okMsg)+" · No se pudo guardar: la imagen puede ser muy pesada")}return}
  const a=await artifactP;
  if(!a){ui.publishBlocked=true;remember();render();toast(esc(okMsg)+" · Solo en esta vista (modo demostración)");return}
  try{store.sset("toast",okMsg+" · Publicado para todos los visitantes");remember();await a.publish(buildDoc());}
  catch(e){store.sset("toast",null);const c=e&&e.code;
    if(c==="conflict"){toast("Otra persona publicó un cambio al mismo tiempo. La página se actualizó: volvé a cargar el dato.");}
    else{ui.publishBlocked=true;remember();render();toast(esc(okMsg)+" · Solo en esta vista: tu cuenta no puede publicar cambios")}}
}

/* ---------- shell ---------- */
const NAV=[["home","Inicio","home"],["calendar","Calendario","cal"],["projects","Proyectos","flask"],["location","Ubicación","pin"],["admin","Admin","user"]];
function navKey(){const v=ui.view;return v==="event"?"calendar":v==="project"?"projects":v}
function isDark(){const t=document.documentElement.getAttribute("data-theme");if(t)return t==="dark";return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches}

function shell(){
  const k=navKey();
  return `<header class="topbar"><div class="topbar-in">
    <button class="brand" data-go="home" aria-label="CENIIT Conecta, ir al inicio"><img src="${SQ_IMG}" alt=""><div><b>CENIIT</b><span>Conecta · UNLaR</span></div></button>
    <nav class="topnav" aria-label="Secciones">${NAV.map(([v,l,ic])=>`<button data-go="${v}" ${k===v?'aria-current="page"':""}>${I(ic,"sm")}${v==="admin"&&ui.logged?"Panel":l}${v==="admin"&&ui.logged?' <span class="dot" title="Sesión iniciada"></span>':""}</button>`).join("")}</nav>
    <button class="theme-btn" data-act="theme" aria-label="${isDark()?"Cambiar a modo claro":"Cambiar a modo oscuro"}" title="${isDark()?"Modo claro":"Modo oscuro"}">${I(isDark()?"sun":"moon")}</button>
  </div></header>
  <main id="view" tabindex="-1">${view()}${footer()}</main>
  <nav class="tabbar" aria-label="Secciones"><div class="tabbar-in">${NAV.map(([v,l,ic])=>`<button data-go="${v}" ${k===v?'aria-current="page"':""}><span class="pill">${I(ic)}</span>${v==="admin"&&ui.logged?"Panel":l}${v==="admin"&&ui.logged?'<span class="dot"></span>':""}</button>`).join("")}</div></nav>`;
}
function view(){
  switch(ui.view){
    case"calendar":return vCalendar();
    case"projects":return vProjects();
    case"location":return vLocation();
    case"admin":return ui.logged?vAdmin():vLogin();
    case"event":return vEvent(S.events.find(e=>e.id===ui.param));
    case"project":return vProject(S.projects.find(p=>p.id===ui.param));
    default:return vHome();
  }
}

/* ---------- shared bits ---------- */
const typeChip=e=>`<span class="chip t-${esc(TYPE_LABEL[e.type]?e.type:"otro")}">${esc(typeName(e))}</span>`;
const exampleChip=o=>o.example?'<span class="chip example" title="Contenido de muestra para el prototipo">Ejemplo</span>':"";
function topicIcon(t){t=(t||'').toLowerCase();return /inteligencia|ia\b|datos|tecnolog|digital/.test(t)?'cpu':/salud|médic|medic/.test(t)?'heart':/bio|célul|celul|gen/.test(t)?'dna':/extensi|social|comunidad/.test(t)?'users':'flask'}
function cover(o,icon){if(o.image)return `<img src="${esc(o.image)}" alt="" loading="lazy">`;let h=0;for(const c of (o.title||''))h=(h*31+c.charCodeAt(0))%360;return `<div class="cover-art" style="--ang:${100+h%140}deg">${I(icon==='flask'?topicIcon(o.topic):icon)}</div>`}
function projCard(p){return `<button class="pcard" data-open-project="${esc(p.id)}">
  <div class="cover">${cover(p,"flask")}</div>
  <div class="body"><div class="tagrow"><span class="chip neutral">${esc(p.topic)}</span>${exampleChip(p)}</div><h3>${esc(p.title)}</h3><p>${esc(p.lead)}</p>
  <div class="meta"><span>${I("cal","sm")}${esc(fmtMid(p.date))}</span></div></div></button>`}
function saveBtn(e){const on=saved.has(e.id);return `<button class="save-btn" data-save="${esc(e.id)}" aria-pressed="${on}" aria-label="${on?"Quitar de agendados":"Agendar evento"}" title="${on?"Agendado":"Agendar"}">${I("bookmark")}</button>`}
function eventCard(e){const st=evStatus(e);
  return `<article class="ecard ${st==="past"?"past":""}" data-open-event="${esc(e.id)}" tabindex="0" role="button" aria-label="${esc(e.title)}">
  <div class="datebox"><b>${parseD(e.date).getDate()}</b><span>${MONTHS[parseD(e.date).getMonth()]}</span></div>
  <div class="main"><div class="tagrow">${typeChip(e)}${e.topic?`<span class="chip neutral">${esc(e.topic)}</span>`:""}${exampleChip(e)}</div>
    <span class="time">${esc(e.start)}${e.end?" – "+esc(e.end):""} h</span>
    <h3>${esc(e.title)}</h3>
    <div class="meta"><span>${I("users","sm")}${esc(e.org||"CENIIT – UNLaR")}</span><span>${I(e.modality==="virtual"?"globe":"pin","sm")}${esc(e.modality==="virtual"?"Virtual":e.venue)}</span></div></div>
  ${st==="past"?"<span></span>":saveBtn(e)}</article>`}
function mapBlock(url,label){return `<a class="map" href="${esc(safeUrl(url)||MAPS_DEFAULT)}" target="_blank" rel="noopener" aria-label="Abrir ${esc(label)} en Google Maps">
  <div class="pin"><svg viewBox="0 0 24 24"><path d="M12 22s8-6.8 8-13a8 8 0 0 0-16 0c0 6.2 8 13 8 13z" fill="#013179" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="9" r="3" fill="#fff"/></svg><span>${esc(label)}</span></div>
  <span class="note">Mapa ilustrativo</span><span class="open">${I("ext","sm")}Abrir en Google Maps</span></a>`}
function backBtn(to,label){return `<button class="btn-link back" data-go="${to}">${I("back","sm")}${label}</button>`}

/* ---------- views ---------- */

  const projs=[...S.projects].sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||b.date.localeCompare(a.date)).slice(0,3);
  const mine=upcoming.filter(e=>saved.has(e.id));
  const info=S.info;
  return `
  ${mine.length?`<div class="reminder" style="margin-bottom:16px">${I("bell")}<div><b>Tenés ${mine.length} evento${mine.length>1?"s":""} agendado${mine.length>1?"s":""}.</b> Próximo: <button class="btn-link" style="padding:0" data-open-event="${esc(mine[0].id)}">${esc(mine[0].title)}</button> · ${mine[0].date===t?"hoy":esc(fmtShort(mine[0].date))}, ${esc(mine[0].start)} h</div></div>`:""}

    <button class="hero ${ui.flip?"flipped":""}" data-act="flip" aria-pressed="${ui.flip}" aria-label="${ui.flip?"Volver a la imagen":"Ver qué es el CENIIT"}">
      <div class="hero-in">
        <div class="face front" aria-hidden="${ui.flip}">

          <span class="hint">${I("info","sm")}Tocá para conocer el CENIIT</span>
        </div>
        <div class="face back" aria-hidden="${!ui.flip}">
          <div style="display:grid;gap:10px"><span class="eyebrow" style="color:rgba(255,255,255,.75)">¿Qué es el CENIIT?</span>
          <h2>El núcleo de la investigación de la UNLaR</h2>
          <p>${esc(info.about||"")}</p></div>
          <div class="facts"><span>Desde 2010</span><span>Ciencia abierta y transdisciplinaria</span><span>Becas para estudiantes</span></div>
          <span class="hint">${I("back","sm")}Tocá para volver</span>
        </div>
      </div>
    </button>
    <aside class="side" aria-labelledby="next-h">
      <div class="sec-head"><h2 id="next-h">Próximos eventos</h2><button class="btn-link" data-go="calendar">Ver calendario ${I("arrow","sm")}</button></div>
      ${upcoming.length?upcoming.slice(0,3).map(e=>`<button class="mini" data-open-event="${esc(e.id)}"><div class="datebox"><b>${parseD(e.date).getDate()}</b><span>${MONTHS[parseD(e.date).getMonth()]}</span></div><div><h3>${esc(e.title)}</h3><p>${esc(typeName(e))} · ${esc(e.start)} h · ${esc(e.modality==="virtual"?"Virtual":e.venue)}</p></div></button>`).join(""):`<p class="lead">No hay eventos programados por ahora.</p>`}
    </aside>

  <section class="section" aria-labelledby="proj-h">
    <div class="sec-head"><div><span class="eyebrow">Investigación</span><h2 id="proj-h">Proyectos destacados</h2></div></div>
    ${projs.length?`<div class="grid">${projs.map(projCard).join("")}</div>`:`<div class="empty">Todavía no hay proyectos cargados.</div>`}
    <div><button class="btn btn-ghost" data-go="projects">Ver más proyectos ${I("arrow","sm")}</button></div>
  </section>

function vProjects(){
  const f=ui.pf;const topics=[...new Set(S.projects.map(p=>p.topic).filter(Boolean))].sort();
  const years=[...new Set(S.projects.map(p=>p.date.slice(0,4)))].sort().reverse();
  const q=f.q.trim().toLowerCase();
  const list=S.projects.filter(p=>(!q||p.title.toLowerCase().includes(q))&&(!f.topic||p.topic===f.topic)&&(!f.year||p.date.startsWith(f.year))).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="page-title"><span class="eyebrow">Investigación y extensión</span><h1>Proyectos</h1><p class="lead">Proyectos e investigaciones realizados en el CENIIT. Buscá por nombre o filtrá por temática y año.</p></div>
  <div class="filters static" role="search">
    <div class="search"><label class="sr" for="pq">Buscar proyecto por nombre</label>${I("search")}<input class="input" id="pq" type="search" placeholder="Buscar proyecto por nombre" value="${esc(f.q)}" data-pf="q" autocomplete="off"></div>
    <div class="filters-row" style="display:grid">
      <div class="field"><label for="ptopic">Temática</label><select class="input" id="ptopic" data-pf="topic"><option value="">Todas</option>${topics.map(t=>`<option ${f.topic===t?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
      <div class="field"><label for="pyear">Fecha (año)</label><select class="input" id="pyear" data-pf="year"><option value="">Todos los años</option>${years.map(y=>`<option ${f.year===y?"selected":""}>${y}</option>`).join("")}</select></div>
    </div>
    <div class="filters-foot"><span class="count" id="pcount">${list.length} proyecto${list.length===1?"":"s"}</span>${(f.q||f.topic||f.year)?`<button class="btn-link" data-act="pclear">Limpiar filtros</button>`:""}</div>
  </div>
  <div id="plist" style="margin-top:18px">${projList(list)}</div>`;
}
function projList(list){return list.length?`<div class="grid">${list.map(projCard).join("")}</div>`:`<div class="empty">No encontramos proyectos con esos filtros.</div>`}

function vProject(p){
  if(!p)return `${backBtn("projects","Proyectos")}<div class="empty">Este proyecto ya no está disponible.</div>`;
  return `<article class="detail">${backBtn("projects","Todos los proyectos")}
    <header class="detail-head"><div class="tagrow"><span class="chip neutral">${esc(p.topic)}</span>${exampleChip(p)}</div>
      <h1>${esc(p.title)}</h1>

function vCalendar(){

  const venues=[...new Set(S.events.filter(e=>e.modality!=="virtual").map(e=>e.venue).filter(Boolean))].sort();

      <div class="field"><label for="ctopic">Temática</label><select class="input" id="ctopic" data-cf="topic"><option value="">Todas</option>${topics.map(t=>`<option ${f.topic===t?"selected":""}>${esc(t)}</option>`).join("")}</select></div>

      <div class="field"><label for="cslot">Horario</label><select class="input" id="cslot" data-cf="slot"><option value="">Todo el día</option><option value="manana" ${f.slot==="manana"?"selected":""}>Mañana (antes de 12 h)</option><option value="tarde" ${f.slot==="tarde"?"selected":""}>Tarde (12 a 19 h)</option><option value="noche" ${f.slot==="noche"?"selected":""}>Noche (desde 19 h)</option></select></div>
    </div>
    ${active?`<div class="filters-foot"><span class="count">${active} filtro${active>1?"s":""} activo${active>1?"s":""}</span><button class="btn-link" data-act="cclear">Limpiar filtros</button></div>`:""}
  </div>
  <div id="clist">${calList()}</div>`;
}
function calList(){
  const f=ui.cf;
  const list=S.events.filter(e=>(!f.type||(f.type.startsWith("otro:")?(e.type==="otro"&&typeName(e)===f.type.slice(5)):e.type===f.type))&&(!f.topic||e.topic===f.topic)&&(!f.date||e.date===f.date)&&(!f.venue||(f.venue==="__virtual"?e.modality==="virtual":e.venue===f.venue))&&(!f.slot||slotOf(e.start)===f.slot)&&(!f.saved||saved.has(e.id)));
  const g={today:[],next:[],past:[]};list.forEach(e=>g[evStatus(e)].push(e));
  g.today.sort(byDate);g.next.sort(byDate);g.past.sort((a,b)=>byDate(b,a));
  if(!list.length)return `<div class="empty" style="margin-top:18px">${f.saved?"Todavía no agendaste eventos. Tocá el ícono de marcador en un evento para agendarlo.":"No hay eventos que coincidan con estos filtros."}</div>`;
  const grp=(k,title,ic)=>g[k].length?`<section class="group" aria-label="${title}"><h2>${I(ic,"sm")}${title} <span class="chip neutral">${g[k].length}</span></h2>${g[k].map(eventCard).join("")}</section>`:"";
  return grp("today","Hoy","clock")+grp("next","Próximos","cal")+grp("past","Finalizados recientemente","check");
}

    <div class="field"><label for="if-phone2">Teléfono alternativo</label><input class="input" id="if-phone2" name="phone2" value="${esc(i.phone2)}"></div>
    <div class="field"><label for="if-email">Correo electrónico</label><input class="input" id="if-email" name="email" type="email" value="${esc(i.email)}"></div>
    <div class="field"><label for="if-address">Dirección</label><input class="input" id="if-address" name="address" value="${esc(i.address)}"></div>
    <div class="field"><label for="if-hours">Horario de atención</label><input class="input" id="if-hours" name="hours" value="${esc(i.hours)}"></div>
    <div><button class="btn btn-ghost" type="submit">Guardar datos</button></div></form>`;
}

/* image handling: resize before embedding */
const pendingImgs={};
function readImage(file){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error("type"));
  const r=new FileReader();r.onerror=()=>rej(new Error("read"));r.onload=()=>{const img=new Image();img.onload=()=>{const max=1100;let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",.78))};img.onerror=()=>rej(new Error("img"));img.src=r.result};r.readAsDataURL(file)})}

async function sha256(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return null}}

/* ---------- render & events ---------- */
function render(){
  const y=window.scrollY;
  document.getElementById("app").innerHTML=shell();
  return y;
}
function rerenderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y)}

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-go],[data-act],[data-open-event],[data-open-project],[data-save],[data-tab],[data-edit],[data-askdel],[data-del],[data-copy],[data-clearimg]");
  if(!t)return;
  if(t.dataset.save){ev.stopPropagation();const id=t.dataset.save;if(saved.has(id)){saved.delete(id);toast("Quitado de tus agendados")}else{saved.add(id);toast("Evento agendado. Lo vas a ver en Inicio como recordatorio.")}store.set("saved",[...saved]);rerenderKeepScroll();return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.openEvent){go("event",t.dataset.openEvent);return}
  if(t.dataset.openProject){go("project",t.dataset.openProject);return}
  if(t.dataset.tab){ui.adminTab=t.dataset.tab;ui.editing=null;ui.confirmDel=null;remember();rerenderKeepScroll();return}
  if(t.dataset.edit){const [kind,id]=t.dataset.edit.split(":");ui.editing={kind,id};ui.adminTab=kind;go("admin");return}
  if(t.dataset.askdel){ui.confirmDel=t.dataset.askdel;rerenderKeepScroll();return}
  if(t.dataset.del){const [kind,id]=t.dataset.del.split(":");const arr=kind==="event"?S.events:S.projects;const i=arr.findIndex(o=>o.id===id);if(i>=0)arr.splice(i,1);ui.confirmDel=null;if(ui.editing&&ui.editing.id===id)ui.editing=null;saved.delete(id);store.set("saved",[...saved]);persist(kind==="event"?"Evento eliminado":"Proyecto eliminado");return}
  if(t.dataset.copy){const v=t.dataset.copy;try{await navigator.clipboard.writeText(v);toast("Copiado: "+esc(v))}catch(e){toast("Seleccioná el texto para copiarlo: "+esc(v))}return}
  if(t.dataset.clearimg){const k=t.dataset.clearimg;pendingImgs[k]=null;const h=t.closest("form").querySelector(`input[type=hidden][name="${k}"]`);if(h)h.value="";$("#"+k+"-thumb").innerHTML=I("image");t.remove();return}
  const a=t.dataset.act;
  if(a==="flip"){ui.flip=!ui.flip;remember();const h=t;h.classList.toggle("flipped",ui.flip);h.setAttribute("aria-pressed",ui.flip);h.setAttribute("aria-label",ui.flip?"Volver a la imagen":"Ver qué es el CENIIT");h.querySelector(".front").setAttribute("aria-hidden",ui.flip);h.querySelector(".back").setAttribute("aria-hidden",!ui.flip);return}
  if(a==="theme"){const next=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",next);store.set("theme",next);rerenderKeepScroll();return}
  if(a==="ftoggle"){ui.filtersOpen=!ui.filtersOpen;remember();rerenderKeepScroll();return}
  if(a==="fsaved"){ui.cf.saved=!ui.cf.saved;remember();rerenderKeepScroll();return}
  if(a==="cclear"){ui.cf={type:"",topic:"",date:"",venue:"",slot:"",saved:false};remember();rerenderKeepScroll();return}
  if(a==="pclear"){ui.pf={q:"",topic:"",year:""};remember();rerenderKeepScroll();return}
  if(a==="logout"){ui.logged=false;ui.editing=null;remember();go("home");toast("Cerraste sesión");return}
  if(a==="canceledit"){ui.editing=null;remember();rerenderKeepScroll();return}
  if(a==="nodel"){ui.confirmDel=null;rerenderKeepScroll();return}
});
document.addEventListener("keydown",ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches(".ecard")){ev.preventDefault();go("event",ev.target.dataset.openEvent)}});

document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset.pf==="q"){ui.pf.q=el.value;remember();updateProjects();return}
  if(el.form&&el.form.id==="event-form"&&(el.name==="start"||el.name==="end")){const f=el.form.elements;const d=duration({start:f.start.value,end:f.end.value});$("#ef-dur").textContent=d?"Duración del evento: "+d:"La hora de cierre tiene que ser posterior a la de inicio.";}
});
function updateProjects(){const host=$("#plist");if(!host)return;const f=ui.pf;const q=f.q.trim().toLowerCase();
  const list=S.projects.filter(p=>(!q||p.title.toLowerCase().includes(q))&&(!f.topic||p.topic===f.topic)&&(!f.year||p.date.startsWith(f.year))).sort((a,b)=>b.date.localeCompare(a.date));
  host.innerHTML=projList(list);const c=$("#pcount");if(c)c.textContent=list.length+" proyecto"+(list.length===1?"":"s")}
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.id==="ef-type"){const w=$("#ef-other-wrap"),o=$("#ef-other");const on=el.value==="otro";w.hidden=!on;o.required=on;if(on)o.focus();return}
  if(el.dataset.pf){ui.pf[el.dataset.pf]=el.value;remember();rerenderKeepScroll();return}
  if(el.dataset.cf){ui.cf[el.dataset.cf]=el.value;remember();rerenderKeepScroll();return}
  if(el.dataset.img){const k=el.dataset.img;const f=el.files&&el.files[0];if(!f)return;
    try{const uri=await readImage(f);pendingImgs[k]=uri;$("#"+k+"-thumb").innerHTML=`<img src="${uri}" alt="">`;const h=el.form.querySelector(`input[type=hidden][name="${k}"]`);if(h)h.value="__new"}
    catch(e){toast("No pudimos leer esa imagen. Probá con un archivo JPG o PNG.");el.value=""}}
});

document.addEventListener("submit",async ev=>{
  ev.preventDefault();const form=ev.target;const f=form.elements;
  if(form.id==="login-form"){const u=f.u.value.trim(),p=f.p.value;const err=$("#login-err");
    if(!u||!p){err.textContent="Completá usuario y contraseña.";err.hidden=false;return}
    const h=await sha256(p);const ok=S.accounts.some(a=>a.user.toLowerCase()===u.toLowerCase()&&a.hash===h);
    if(!ok){err.textContent="Usuario o contraseña incorrectos. Revisalos e intentá de nuevo.";err.hidden=false;f.p.value="";f.p.focus();return}
    ui.logged=true;ui.adminTab="event";ui.editing=null;remember();go("admin");toast("Sesión iniciada como administrador");return}
  if(form.id==="info-form"){["phone","phone2","email","address","hours"].forEach(k=>S.info[k]=f[k].value.trim());persist("Datos de contacto guardados");return}
  if(form.id==="event-form"||form.id==="project-form"){
    const isEv=form.id==="event-form";const errEl=$(isEv?"#ef-err":"#pf-err");
    const missing=[...form.querySelectorAll("[required]")].filter(x=>!x.value.trim());
    form.querySelectorAll(".input").forEach(x=>x.removeAttribute("aria-invalid"));
    if(missing.length){missing.forEach(x=>x.setAttribute("aria-invalid","true"));errEl.textContent="Completá los campos obligatorios marcados con *.";errEl.hidden=false;missing[0].focus();return}
    const id=form.dataset.id;const arr=isEv?S.events:S.projects;const old=id?arr.find(o=>o.id===id):null;
    const img=k=>{const h=form.querySelector(`input[type=hidden][name="${k}"]`);const v=h&&h.value;if(v==="__new")return pendingImgs[k]||"";if(v==="__keep")return old?old[k]||"":"";return ""};
    let o;
    if(isEv){
      if(!(mins(f.end.value)>mins(f.start.value))){errEl.textContent="La hora de cierre tiene que ser posterior a la de inicio.";errEl.hidden=false;f.end.focus();return}
      const modality=(form.querySelector("input[name=modality]:checked")||{}).value||"presencial";
      if(modality!=="virtual"&&!f.venue.value.trim()){errEl.textContent="Indicá el lugar: es obligatorio para eventos presenciales o híbridos.";errEl.hidden=false;f.venue.focus();return}
      for(const k of ["mapsUrl","formUrl"]){if(f[k].value.trim()&&!safeUrl(f[k].value)){errEl.textContent="Los enlaces tienen que empezar con https://";errEl.hidden=false;f[k].focus();return}}
      o={id:id||uid(),title:f.namedItem("title").value.trim(),type:f.type.value,typeOther:f.type.value==="otro"?f.typeOther.value.trim():"",topic:f.topic.value.trim(),date:f.date.value,start:f.start.value,end:f.end.value,modality,venue:f.venue.value.trim(),org:f.org.value.trim()||"CENIIT – UNLaR",mapsUrl:f.mapsUrl.value.trim(),description:f.description.value.trim(),formUrl:f.formUrl.value.trim(),image:img("image"),placeImage:img("placeImage")};
    }else{
      const links=f.links.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf("|");return i>=0?{label:l.slice(0,i).trim(),url:l.slice(i+1).trim()}:{label:"",url:l}});
      if(links.some(l=>!safeUrl(l.url))){errEl.textContent="Cada enlace tiene que empezar con https:// (formato: Nombre | https://enlace).";errEl.hidden=false;f.links.focus();return}
      o={id:id||uid(),title:f.namedItem("title").value.trim(),authors:f.authors.value.trim(),date:f.date.value,topic:f.topic.value.trim(),lead:f.lead.value.trim(),body:f.body.value.trim(),links,image:img("image"),featured:f.featured.checked};
    }
    if(old){Object.assign(old,o);delete old.example}else arr.push(o);
    Object.keys(pendingImgs).forEach(k=>delete pendingImgs[k]);
    ui.editing=null;ui.view=isEv?"event":"project";ui.param=o.id;remember();window.scrollTo(0,0);
    persist(old?"Cambios guardados":isEv?"Evento publicado en el Calendario":"Proyecto publicado en Proyectos");
  }
});
if(window.matchMedia){try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(!document.documentElement.getAttribute("data-theme"))rerenderKeepScroll()})}catch(e){}}

render();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
